services:
  app:
    container_name: rowerg-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: no
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - .:/usr/src/app
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-secret-key-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-rowerg}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_HOST=db
      - PER_PAGE=${PER_PAGE:-10}
      - PYTHONUNBUFFERED=1
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000", "--reload"]
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: rowerg-db
    image: postgres:17
    restart: no
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rowerg}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - ./db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-rowerg}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
